name: Daily AI Trends Report → Telegram

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  send-daily-report:
    name: Fetch AI Trends & Send to Telegram
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install requests feedparser
      - name: Run daily AI report
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/daily_report.py
      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 -c "
          import os, requests
          requests.post(f'https://api.telegram.org/bot{os.environ[\"TELEGRAM_TOKEN\"]}/sendMessage',
              json={'chat_id': os.environ['TELEGRAM_CHAT_ID'],
                    'text': '⚠️ <b>Ariztia AI Report — ERROR</b>\nRevisa GitHub Actions.',
                    'parse_mode': 'HTML'}, timeout=15)"
